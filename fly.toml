# fly.toml app configuration file generated for varta-backaend on 2026-11-02T18:27:10Z
#
# See https://fly.io/docs/reference/configuration/ for information about how this file.
#

app = 'varta-backaend'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
